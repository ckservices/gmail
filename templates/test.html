<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign in - Google Accounts</title>
    <style>
        /* --- Reset & Basic Setup --- */
        * {
            box-sizing: border-box;
            font-family: 'Roboto', Arial, sans-serif; /* Using standard fonts that resemble Google's */
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #202124; /* Google Dark Mode Background */
            color: #e8eaed; /* Primary Light Text */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Main Container --- */
        /* This container holds everything and ensures it's centered and doesn't get too wide on larger mobile screens */
        .login-container {
            width: 100%;
            max-width: 450px; /* Typical max width for mobile login cards */
            padding: 24px 24px 36px;
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Ensure full height on small screens */
        }

        /* For slightly taller screens, center the content vertically */
        @media (min-height: 600px) {
            .login-container {
                min-height: auto;
                display: block;
            }
        }

        /* --- Header Section --- */
        .header {
            text-align: left;
            padding-top: 24px;
        }

        .google-logo-svg {
            width: 48px;
            height: 48px;
            display: block;
            margin-bottom: 10px;
        }

        h1 {
            font-weight: 400;
            font-size: 24px;
            margin: 0 0 8px 0;
            line-height: 1.3333;
        }

        .subtitle {
            font-size: 16px;
            color: #bdc1c6; /* Secondary text color */
            margin: 0 0 35px 0;
            letter-spacing: 0.1px;
            line-height: 1.5;
        }

        /* --- The Floating Label Input Field (The Tricky Part) --- */
        .input-group {
            position: relative;
            margin-bottom: 8px;
        }

        /* The actual input box */
        .input-field {
            width: 100%;
            background-color: transparent;
            border: 1px solid #5f6368; /* Inactive border color */
            border-radius: 4px;
            padding: 13px 15px;
            color: #e8eaed;
            font-size: 16px;
            height: 56px;
            outline: none; /* Remove default browser outline */
            transition: border-color 0.2s;
        }

        /* The label text ("Email or phone") */
        .input-label {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #202124; /* Match background to hide border behind it */
            padding: 0 6px;
            color: #bdc1c6;
            font-size: 16px;
            pointer-events: none; /* Lets clicks pass through to the input */
            transition: 0.2s ease all;
        }

        /* --- Input States (Focus and Filled) --- */
        /* When input is focused */
        .input-field:focus {
            border: 2px solid #8ab4f8; /* Google Blue focus color */
            padding: 12px 14px; /* Adjust padding to account for thicker border */
        }

        /* Move label up when focused OR when input has text (valid) */
        .input-field:focus ~ .input-label,
        .input-field:valid ~ .input-label {
            top: 0;
            transform: translateY(-50%) scale(0.85); /* Move up and shrink slightly */
            left: 10px; /* Adjust horizontal position slightly */
        }

        /* Change label color only when focused */
        .input-field:focus ~ .input-label {
            color: #8ab4f8;
        }

        /* --- Links and Helper Text --- */
        .link-blue {
            color: #8ab4f8;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 0.25px;
            cursor: pointer;
        }

        .forgot-email {
            display: inline-block;
            margin-bottom: 40px;
            font-weight: 500;
        }

        .guest-mode-text {
            font-size: 14px;
            color: #bdc1c6;
            line-height: 1.4286;
            margin-bottom: 40px;
        }

        /* --- Bottom Action Buttons --- */
        .action-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto; /* Pushes to bottom on short screens */
            padding-bottom: 20px;
        }

        .next-button {
            background-color: #8ab4f8; /* Blue background */
            color: #202124; /* Dark text on blue button */
            border: none;
            border-radius: 18px; /* Pill shape */
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.25px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .next-button:active {
             background-color: #7aa0e0; /* Slightly darker blue on tap */
        }

    </style>
</head>
<body>

    <div class="login-container">
        <header class="header">
            <svg class="google-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
            </svg>
            <h1>Sign in</h1>
            <p class="subtitle">Use your Google Account</p>
        </header>

        <main>
            <form onsubmit="event.preventDefault();"> <div class="input-group">
                    <input type="text" id="identifier" class="input-field" required>
                    <label for="identifier" class="input-label">Email or phone</label>
                </div>
                <a class="link-blue forgot-email">Forgot email?</a>
            </form>

            <p class="guest-mode-text">
                Not your computer? Use a private browsing window to sign in.
                <a class="link-blue">Learn more about using Guest mode</a>
            </p>
        </main>

        <footer class="action-buttons">
            <a class="link-blue">Create account</a>
            <button class="next-button">Next</button>
        </footer>
    </div>

</body>
</html>
