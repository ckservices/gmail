# Redirect HTTP to HTTPS
<VirtualHost *:80>
    ServerName gspace.cssofficie.com

    # Redirect all HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]

    ErrorLog /var/log/apache2/gmailapp_error.log
    CustomLog /var/log/apache2/gmailapp_access.log combined
</VirtualHost>

# HTTPS VirtualHost with Let's Encrypt SSL
<VirtualHost *:443>
    ServerName gspace.cssofficie.com

    WSGIDaemonProcess gmailapp user=www-data group=www-data threads=5
    WSGIScriptAlias / /app/app.wsgi
    <Directory /app>
        Require all granted
    </Directory>

    # Set secure headers for authentication cookies
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ErrorLog /var/log/apache2/gmailapp_error.log
    CustomLog /var/log/apache2/gmailapp_access.log combined
</VirtualHost>
